name: NextUI H700 Korean i18n build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-h700:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Install build host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git make zip unzip jq libzip-tools
          docker --version
          docker info >/dev/null

