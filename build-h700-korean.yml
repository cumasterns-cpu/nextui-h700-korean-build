      - name: Fetch i18n PR #735 merge candidate
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/LoveRetro/NextUI.git nextui-src
          cd nextui-src
          git fetch --no-tags origin refs/pull/735/merge:refs/remotes/origin/pr-735-merge
          git checkout --detach refs/remotes/origin/pr-735-merge
          test -f skeleton/SYSTEM/res/lang/en.lang
          test -f workspace/all/common/i18n.c
          grep -q 'h700' makefile
          echo "Using NextUI source commit $(git rev-parse --short HEAD)"

      - name: Validate Korean translations and install ko.lang
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          token = re.compile(r"%(?:[-+ #0']*)?(?:\d+|\*)?(?:\.(?:\d+|\*))?(?:hh|h|ll|l|z|j|t|L)?[diuoxXfFeEgGaAcspn%]")

          def read_lang(path):
              data = {}
              duplicates = []
              for n, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  line = raw.lstrip(" \t")
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  key = key.rstrip(" \t")
                  if key in data:
                      duplicates.append((n, key))
                  data[key] = value.strip(" \t\r")
              return data, duplicates

          en_path = Path("nextui-src/skeleton/SYSTEM/res/lang/en.lang")
          ko_path = Path("ko.lang")
          en, en_dup = read_lang(en_path)
          ko, ko_dup = read_lang(ko_path)
          if en_dup or ko_dup:
              raise SystemExit(f"Duplicate language keys: en={len(en_dup)}, ko={len(ko_dup)}")
          mismatch = []
          for key in en.keys() & ko.keys():
              if Counter(token.findall(en[key])) != Counter(token.findall(ko[key])):
                  mismatch.append(key)
          if mismatch:
              raise SystemExit("Format placeholder mismatch: " + ", ".join(mismatch[:20]))
          long_lines = [n for n, line in enumerate(ko_path.read_text(encoding="utf-8").splitlines(), 1) if len(line.encode("utf-8")) >= 1024]
          if long_lines:
              raise SystemExit(f"ko.lang lines exceed i18n parser limit: {long_lines[:10]}")
          missing = len(en.keys() - ko.keys())
          print(f"English keys: {len(en)}")
          print(f"Korean overrides: {len(ko)}")
          print(f"Untranslated keys: {missing} (will fall back to English)")
          print("Duplicate keys, placeholders, and parser line lengths: OK")
          PY
          mkdir -p nextui-src/skeleton/SYSTEM/res/lang
          cp ko.lang nextui-src/skeleton/SYSTEM/res/lang/ko.lang

      - name: Build H700 release
        shell: bash
        run: |
          set -euo pipefail
          cd nextui-src
          make all PLATFORMS=h700
          echo "Built release files:"
          find releases -maxdepth 1 -type f -name '*.zip' -printf '%f (%s bytes)\n'
          shopt -s nullglob
          assets=(releases/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release ZIPs were produced" >&2
            exit 1
          fi

      - name: Publish release ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(nextui-src/releases/*.zip)
          test ${#assets[@]} -gt 0
          tag="h700-korean-${{ github.run_number }}"
          gh release create "$tag" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --title "NextUI H700 Korean build ${{ github.run_number }}" \
            --notes "H700 build candidate from the merge ref of LoveRetro/NextUI PR #735, with Korean ko.lang. The PR has not been validated on RG35XX Pro hardware. Do not install without backing up both SD cards."
