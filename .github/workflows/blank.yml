# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in paraNextUI RG35XX Pro(H700) 한국어 자동 빌드 키트
=============================================

이 파일은 SD카드에 직접 설치하는 펌웨어가 아닙니다.
PR #735의 i18n 기능을 포함한 NextUI를 H700용으로 빌드하기 위한 파일입니다.

이전 키트와 달리 저장소에 업로드해 커밋하면 빌드가 자동 시작됩니다.
Actions에서 'Run workflow'를 누를 필요가 없습니다.
빌드가 성공하면 저장소의 Releases에 결과 ZIP이 자동 등록됩니다.

사용 방법
---------
1. 이 ZIP을 PC에서 압축 해제합니다.
2. 이미 만든 GitHub 저장소 페이지를 엽니다.
3. Add file -> Upload files를 선택합니다.
4. 압축을 푼 폴더 안의 파일과 .github 폴더를 저장소 최상위에 업로드합니다.
   중요: .github/workflows/build-h700-i18n.yml 경로가 유지되어야 합니다.
5. 아래쪽 Commit changes를 눌러 main 브랜치에 저장합니다.
6. 저장 직후 자동 빌드가 시작됩니다. 직접 Actions에서 실행할 필요는 없습니다.
7. 빌드가 성공하면 저장소의 Releases에서
   'NextUI H700 Korean build N' 항목의 ZIP을 다운로드합니다.

빌드가 실패하거나 Releases에 결과가 없으면
------------------------------------------
저장소의 Actions 탭에서 실패한 실행을 열어 마지막 오류 부분을 확인해야 합니다.
다만 평소에는 Actions를 열 필요가 없습니다.

중요한 주의사항
---------------
- 기존 TF1/TF2에는 아직 아무것도 복사하지 마세요.
- 이 작업은 SD카드를 수정하지 않습니다.
- PR #735는 아직 H700 실기기에서 검증되지 않았습니다.
- 빌드 성공은 RG35XX Pro 실기기 호환성 보증이 아닙니다.
- 결과 ZIP을 먼저 검사하고, 기존 SD카드 전체 백업 후에만 테스트해야 합니다.
- 빌드는 PR #735의 GitHub merge ref를 사용합니다. PR이 merge 가능한 상태가 아니면 실패할 수 있습니다.
- 저장소는 Public이어야 ARM64 GitHub-hosted runner를 사용할 수 있습니다.

#!/usr/bin/env python3
"""Validate a NextUI .lang translation against the PR #735 en.lang reference."""
from __future__ import annotations
import re
import sys
from collections import Counter
from pathlib import Path

PLACEHOLDER = re.compile(r"%(?:[-+ #0']*)?(?:\d+|\*)?(?:\.(?:\d+|\*))?(?:hh|h|ll|l|z|j|t|L)?[diuoxXfFeEgGaAcspn%]")

def parse(path: Path):
    entries = {}
    duplicates = []
    for n, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
        line = raw.lstrip(" \t")
        if not line or line.startswith("#") or "=" not in line:
            continue
        key, value = line.split("=", 1)
        key = key.rstrip(" \t")
        value = value.lstrip(" \t").rstrip(" \t\r")
        if key in entries:
            duplicates.append((n, key))
        entries[key] = value
    return entries, duplicates

def main():
    if len(sys.argv) != 3:
        print("Usage: validate_ko_lang.py en.lang ko.lang")
        return 2
    en_path, ko_path = map(Path, sys.argv[1:])
    en, en_dups = parse(en_path)
    ko, ko_dups = parse(ko_path)
    missing = sorted(set(en) - set(ko))
    extra = sorted(set(ko) - set(en))
    fmt = []
    for key in sorted(set(en) & set(ko)):
        a = Counter(PLACEHOLDER.findall(en[key]))
        b = Counter(PLACEHOLDER.findall(ko[key]))
        if a != b:
            fmt.append((key, sorted(a.items()), sorted(b.items())))
    long_lines = [(n, len(line.encode("utf-8"))) for n, line in enumerate(ko_path.read_text(encoding="utf-8").splitlines(), 1) if len(line.encode("utf-8")) >= 1024]
    print(f"en.lang entries: {len(en)}")
    print(f"ko.lang entries: {len(ko)}")
    print(f"Missing keys: {len(missing)}")
    print(f"Extra keys: {len(extra)}")
    print(f"Placeholder mismatches: {len(fmt)}")
    print(f"Duplicate keys: {len(en_dups) + len(ko_dups)}")
    print(f"Lines >= 1024 bytes: {len(long_lines)}")
    for title, values in (("MISSING", missing), ("EXTRA", extra)):
        for value in values[:80]: print(f"{title}: {value}")
    for key, a, b in fmt: print(f"FORMAT: {key}: en={a}, ko={b}")
    for item in en_dups + ko_dups: print(f"DUPLICATE: line {item[0]} key={item[1]}")
    for item in long_lines: print(f"LONG LINE: line {item[0]} bytes={item[1]}")
    return 1 if (missing or extra or fmt or en_dups or ko_dups or long_lines) else 0

if __name__ == "__main__":
    raise SystemExit(main())

