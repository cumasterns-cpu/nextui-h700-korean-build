# In-game Frontend options
frontend.opt.screen_scaling=화면 배율
frontend.opt.screen_scaling.desc_overscan=Native는 정수 배율을 사용합니다. Aspect는 코어가 보고한 화면 비율을 사용합니다.\nAspect screen은 화면 비율을 사용합니다.\nFullscreen은 비정사각형 픽셀을 사용합니다.\nCropped는 정수 배율로 확대한 뒤 가장자리를 자릅니다.
frontend.opt.screen_scaling.desc_default=Native는 정수 배율을 사용합니다.\nAspect는 코어가 보고한 화면 비율을 사용합니다.\nAspect screen은 화면 비율을 사용합니다.\nFullscreen은 비정사각형 픽셀을 사용합니다.
frontend.opt.resampling=오디오 리샘플링 품질
frontend.opt.resampling.desc=리샘플링 품질이 높을수록 CPU 사용량이 증가합니다.
frontend.opt.ambient=주변 조명 모드
frontend.opt.ambient.desc=화면에 표시되는 색상에 맞춰 LED를 변경합니다.
frontend.opt.effect=화면 효과
frontend.opt.effect.desc=Grid는 LCD 격자 효과를, Line은 CRT 주사선 효과를 표현합니다.\n대개 원본 배율에서 효과가 가장 자연스럽습니다.
frontend.opt.overlay=오버레이
frontend.opt.overlay.desc=Overlays 폴더에서 사용자 지정 PNG 오버레이를 선택합니다.
frontend.opt.offset_x=화면 X 위치
frontend.opt.offset_x.desc=X축 픽셀 오프셋
frontend.opt.offset_y=화면 Y 위치
frontend.opt.offset_y.desc=Y축 픽셀 오프셋
frontend.opt.sharpness=화면 선명도
frontend.opt.sharpness.desc=LINEAR는 선을 부드럽게 처리하지만, 코어가 고해상도로 출력하거나 셰이더로 확대하는 경우처럼 최종 이미지 해상도가 높을 때 더 적합합니다.
frontend.opt.core_sync=코어 동기화
frontend.opt.core_sync.desc=프레임 속도의 기준을 선택합니다.\nNative는 에뮬레이터 프레임 속도를, Screen은 화면 프레임 속도를 사용합니다.
frontend.opt.cpu_speed=CPU 속도
frontend.opt.cpu_speed.desc=CPU 동작 속도 조정 방식을 선택합니다.\n대부분의 경우 자동 설정을 권장합니다.
frontend.opt.debug_hud=디버그 HUD
frontend.opt.debug_hud.desc=초당 프레임, CPU 부하,\n해상도 및 스케일러 정보를 표시합니다.
frontend.opt.max_ff=최대 빨리 감기 속도
frontend.opt.max_ff.desc=빨리 감기 속도가 선택한 속도를 초과하지 않도록 제한합니다.\n게임과 에뮬레이터에 따라 실제 속도는 더 낮을 수 있습니다.
frontend.opt.ff_audio=빨리 감기 중 오디오
frontend.opt.ff_audio.desc=빨리 감기 중 오디오를 재생하거나 음소거합니다.
frontend.opt.rewind=되감기
frontend.opt.rewind.desc=메모리에 되감기 버퍼를 사용합니다.\n게임 중 되감기를 사용하려면 단축키를 지정해야 합니다.\nCPU와 메모리를 추가로 사용합니다.
frontend.opt.rewind_buffer=되감기 버퍼 (MB)
frontend.opt.rewind_buffer.desc=되감기 스냅샷에 사용할 메모리 용량입니다.\n값을 높이면 더 긴 시간 동안 되감을 수 있습니다.
frontend.opt.rewind_interval=되감기 간격
frontend.opt.rewind_interval.desc=되감기 스냅샷 사이의 간격입니다.\n간격이 짧으면 되감기가 부드러워지지만 CPU와 메모리 사용량이 증가합니다.
frontend.opt.rewind_compression=되감기 압축
frontend.opt.rewind_compression.desc=CPU 사용량을 늘리는 대신 되감기 스냅샷을 압축해 메모리를 절약합니다.
frontend.opt.rewind_compression_speed=되감기 압축 속도
frontend.opt.rewind_compression_speed.desc=되감기 스냅샷에 사용할 LZ4 가속 수준입니다.\n값이 낮으면 압축률이 높아지지만 CPU 사용량이 증가합니다.
frontend.opt.rewind_audio=되감기 중 오디오
frontend.opt.rewind_audio.desc=되감기 중 오디오를 재생하거나 음소거합니다.
frontend.opt.opt_shaders=셰이더 추가 설정
frontend.opt.opt_shaders.desc=셰이더에 추가 설정이 있으면 이 메뉴에 표시됩니다.
frontend.opt.shader_preset=셰이더 / 에뮬레이터 설정 프리셋
frontend.opt.shader_preset.desc=미리 만들어진 셰이더 및 에뮬레이터 설정을 불러옵니다.\n프리셋을 시험하려면 설정을 저장하지 말고 게임을 종료하세요.
frontend.opt.shader_count=셰이더 개수
frontend.opt.shader_count.desc=셰이더 개수 (1~3)
frontend.opt.shader_1=셰이더 1
frontend.opt.shader_1.desc=실행할 첫 번째 셰이더 프로그램
frontend.opt.shader_1_filter=셰이더 1 필터
frontend.opt.shader_1_source=셰이더 1 소스 유형
frontend.opt.shader_1_texture=셰이더 1 텍스처 유형
frontend.opt.shader_1_scale=셰이더 1 배율
