      - name: Fetch NextUI i18n merge candidate
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/LoveRetro/NextUI.git nextui-src
          cd nextui-src
          git fetch --no-tags origin refs/pull/735/merge:refs/remotes/origin/pr-735-merge
          git checkout --detach refs/remotes/origin/pr-735-merge
          test -f skeleton/SYSTEM/res/lang/en.lang
          test -f workspace/all/common/i18n.c
          grep -q 'h700' makefile
          echo "NextUI source: $(git rev-parse --short HEAD)"

      - name: Validate and install Korean locale
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from collections import Counter
          from pathlib import Path
          import re

          token = re.compile(r"%(?:[-+ #0']*)?(?:\d+|\*)?(?:\.(?:\d+|\*))?(?:hh|h|ll|l|z|j|t|L)?[diuoxXfFeEgGaAcspn%]")

          def read_lang(path):
              data = {}
              duplicate = []
              for number, raw in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  line = raw.lstrip(' \t')
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  key = key.rstrip(' \t')
                  if key in data:
                      duplicate.append((number, key))
                  data[key] = value.strip(' \t\r')
              return data, duplicate

          en, en_dup = read_lang(Path('nextui-src/skeleton/SYSTEM/res/lang/en.lang'))
          ko, ko_dup = read_lang(Path('ko.lang'))
          if en_dup or ko_dup:
              raise SystemExit(f'duplicate keys: en={len(en_dup)} ko={len(ko_dup)}')
          mismatch = [k for k in en.keys() & ko.keys() if Counter(token.findall(en[k])) != Counter(token.findall(ko[k]))]
          if mismatch:
              raise SystemExit('placeholder mismatch: ' + ', '.join(mismatch[:20]))
          long_lines = [n for n, line in enumerate(Path('ko.lang').read_text(encoding='utf-8').splitlines(), 1) if len(line.encode('utf-8')) >= 1024]
          if long_lines:
              raise SystemExit(f'parser line limit exceeded: {long_lines[:10]}')
          print(f'English keys: {len(en)}')
          print(f'Korean keys: {len(ko)}')
          print(f'English keys without Korean override (fallback to English): {len(en.keys() - ko.keys())}')
          print(f'Korean keys not present in English: {len(ko.keys() - en.keys())}')
          print('Duplicate keys, placeholders and parser limits: OK')
          PYCODE
          mkdir -p nextui-src/skeleton/SYSTEM/res/lang
          cp ko.lang nextui-src/skeleton/SYSTEM/res/lang/ko.lang

      - name: Build H700 release
        shell: bash
        run: |
          set -euo pipefail
          cd nextui-src
          make all PLATFORMS=h700
          shopt -s nullglob
          assets=(releases/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo 'No release ZIPs were produced' >&2
            exit 1
          fi
          printf 'Built: %s\n' "${assets[@]}"

      - name: Publish H700 build release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(nextui-src/releases/*.zip)
          test ${#assets[@]} -gt 0
          tag="h700-korean-${{ github.run_number }}"
          gh release create "$tag" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --title "NextUI H700 Korean build ${{ github.run_number }}" \
            --notes "Build candidate using NextUI PR #735 i18n and the Korean locale. H700 build success does not prove RG35XX Pro hardware compatibility; do not install without a full SD backup."
